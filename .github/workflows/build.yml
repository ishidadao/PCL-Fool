name: Build
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  publisher-test:
    name: Publisher tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Test signed manifest publisher
      run: python3 tools/test_fool_update_publisher.py -v

  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      shell: pwsh
      env:
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        BUILD_COMMIT: ${{ github.sha }}
      run: |
        $secretPath = 'Plain Craft Launcher 2\Modules\ModSecret.vb'
        $secretModule = Get-Content $secretPath -Raw
        $oauthMarker = 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")'
        if (-not $secretModule.Contains($oauthMarker)) {
          throw 'OAuth client ID replacement marker is missing.'
        }
        $oauthReplacement = 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "' + $env:CLIENT_ID + '")'
        $secretModule = $secretModule.Replace($oauthMarker, $oauthReplacement)

        $curseForgeMarker = 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")'
        if ($env:CURSEFORGE_API_KEY -and $secretModule.Contains($curseForgeMarker)) {
          $curseForgeReplacement = 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "' + $env:CURSEFORGE_API_KEY + '")'
          $secretModule = $secretModule.Replace($curseForgeMarker, $curseForgeReplacement)
        }
        Set-Content $secretPath $secretModule -Encoding utf8

        $basePath = 'Plain Craft Launcher 2\Modules\Base\ModBase.vb'
        $baseModule = Get-Content $basePath -Raw
        $commitMarker = 'Public Const CommitHash As String = ""'
        if (-not $baseModule.Contains($commitMarker)) {
          throw 'Commit hash replacement marker is missing.'
        }
        $commitReplacement = 'Public Const CommitHash As String = "' + $env:BUILD_COMMIT + '"'
        Set-Content $basePath ($baseModule.Replace($commitMarker, $commitReplacement)) -Encoding utf8

    - name: Verify Microsoft Login Configuration
      shell: pwsh
      env:
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
      run: |
        $clientId = $env:CLIENT_ID
        if ($clientId -notmatch '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') {
          throw 'CLIENT_ID is missing or is not a valid application ID.'
        }
        $secretModule = Get-Content 'Plain Craft Launcher 2\Modules\ModSecret.vb' -Raw
        if (-not $secretModule.Contains($clientId)) {
          throw 'CLIENT_ID was not injected into ModSecret.vb.'
        }
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe
